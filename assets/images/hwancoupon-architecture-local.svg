<svg width="680" height="462" viewBox="0 0 680 462" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Noto Sans KR',system-ui,sans-serif" role="img">
<title>환쿠폰 로컬 개발 아키텍처</title>
<desc>Client가 Spring Boot API 서버로 요청을 보내고, 서버는 로컬 Docker Compose 환경의 Redis, RabbitMQ, MySQL과 통신하는 구조. 전체가 로컬 개발 머신에서 동작하며 실제 클라우드 배포는 이루어지지 않았다.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#8a97a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="680" height="462" fill="#ffffff"/>

<!-- Client -->
<rect x="210" y="40" width="260" height="56" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#2c2c2a">Client</text>
<text x="340" y="76" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441"></text>

<line x1="340" y1="96" x2="340" y2="192" stroke="#8a97a3" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- outer container -->
<rect x="40" y="136" width="600" height="306" rx="20" fill="#ffffff" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="60" y="160" font-size="14" font-weight="700" fill="#2c2c2a">로컬</text>

<!-- Spring Boot -->
<rect x="170" y="192" width="340" height="56" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
<text x="340" y="210" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#042c53">Spring Boot API Server (:8080)</text>
<text x="340" y="228" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0c447c">REST API · 비동기 컨슈머 · 스케줄러</text>

<!-- docker container -->
<rect x="60" y="296" width="560" height="126" rx="12" fill="#ffffff" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="80" y="320" font-size="14" font-weight="700" fill="#2c2c2a">로컬 (Docker Compose)</text>

<!-- trunk + branches -->
<line x1="340" y1="248" x2="340" y2="330" stroke="#8a97a3" stroke-width="1.5"/>
<path d="M340,330 L161,330 L161,346" fill="none" stroke="#8a97a3" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="330" x2="340" y2="346" stroke="#8a97a3" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340,330 L517,330 L517,346" fill="none" stroke="#8a97a3" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Redis -->
<rect x="80" y="346" width="162" height="56" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.5"/>
<text x="161" y="364" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#4a1b0c">Redis 7</text>
<text x="161" y="382" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712b13">원자적 재고 차감</text>

<!-- RabbitMQ -->
<rect x="258" y="346" width="162" height="56" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.5"/>
<text x="339" y="364" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#412402">RabbitMQ</text>
<text x="339" y="382" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#633806">선착순·대량발급 큐</text>

<!-- MySQL -->
<rect x="436" y="346" width="162" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text x="517" y="364" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#04342c">MySQL 8</text>
<text x="517" y="382" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">쿠폰·발급이력 저장</text>

</svg>
